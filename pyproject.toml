[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-optimizer"
version = "0.1.0.dev0"
description = "Research-oriented agentic prompt optimization with a rigorous evaluation harness."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "ollama>=0.6",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
harness-opt = "harness_optimizer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
